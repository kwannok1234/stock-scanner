name: Daily Stock Scanner

on:
  schedule:
    - cron: '0 4 * * 1-5'    # HKT 12:00 noon (midday check)
    - cron: '30 13 * * 1-5'  # HKT 21:30 (US market open 9:30am ET)
    - cron: '0 21 * * 1-5'   # HKT 05:00 (US market close)
  workflow_dispatch:           # Allow manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests pandas

      - name: Run stock scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python scan.py